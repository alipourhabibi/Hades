// User and account management API for the Hades schema registry.
//
// Users can be individuals (USER_TYPE_USER) or organizations
// (USER_TYPE_ORGANIZATION). Organizations are modelled as user records with a
// different type so that module ownership and RBAC can use a single identity
// namespace. Use OrgService for organization-specific operations.

syntax = "proto3";

package hades.api.identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/identity/v1";

// UserType distinguishes human accounts from organization accounts.
enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  // An organization account. Managed via OrgService.
  USER_TYPE_ORGANIZATION = 1;
  // A regular human account.
  USER_TYPE_USER = 2;
}

// UserState reflects the lifecycle stage of a user account.
enum UserState {
  USER_STATE_UNSPECIFIED = 0;
  // Account is in good standing and can authenticate normally.
  USER_STATE_ACTIVE = 1;
  // Account has been deactivated. Login is rejected.
  USER_STATE_DEACTIVATED = 2;
}

// User is the canonical account record shared by individuals and organizations.
message User {
  // Unique user identifier (UUID).
  string id = 1;
  // When the account was created.
  google.protobuf.Timestamp create_time = 2;
  // When the account was last updated.
  google.protobuf.Timestamp update_time = 3;
  // Unique username used in module paths and mentions. Always lowercase.
  string username = 4;
  // Email address of the account.
  //
  // Returned only on the caller's own record. On anyone else's it is cleared,
  // in profile reads and in listings alike, so the registry cannot be used to
  // harvest addresses. Also empty for organization accounts, which have no
  // address of their own.
  string email = 5;
  // Reserved. Always empty: the password hash is read through a separate
  // internal path and is never carried on this message.
  string password = 6;
  // Whether this record represents a human user or an organization.
  UserType type = 7;
  // Lifecycle state of this account.
  UserState state = 8;
  // Optional human-readable description shown on the profile page.
  string description = 9;
  // Optional URL associated with the account (e.g. website or GitHub profile).
  string url = 10;
}

// CreateUserRequest creates a new user account.
//
// Not implemented: this RPC returns UNIMPLEMENTED. Use
// AuthenticationService.Register, which also validates the password against the
// configured policy and sends a verification email.
message CreateUserRequest {
  string username = 1 [(buf.validate.field).required = true];
  string email = 2 [(buf.validate.field).required = true];
  string password = 3 [(buf.validate.field).required = true];
  string description = 4;
}

// CreateUserResponse carries the newly created user record.
message CreateUserResponse {
  User user = 1;
}

// GetUserRequest looks up a user by their username.
message GetUserRequest {
  // Username of the account to retrieve.
  string username = 1 [(buf.validate.field).string.min_len = 1];
}

// GetUserResponse carries the user profile and summary counts.
message GetUserResponse {
  // Full user record.
  User user = 1;
  // Number of modules owned by this user, including private ones the caller
  // cannot read.
  int32 module_count = 2;
  // Organizations the user belongs to.
  repeated User organizations = 3;
}

// ListUsersRequest searches for user accounts.
message ListUsersRequest {
  // Optional substring search on username. Empty matches every account.
  // At most 50 accounts are returned either way; there is no pagination.
  string query = 1;
}

// ListUsersResponse carries matching user records.
message ListUsersResponse {
  repeated User users = 1;
}

// UpdateUserRequest updates the profile fields for the authenticated user.
// Only the caller's own account can be updated via this RPC.
message UpdateUserRequest {
  // New description. Both fields are written on every call, so passing an empty
  // string clears the stored value rather than leaving it unchanged.
  string description = 1;
  // New URL. Cleared by an empty string, as with description.
  string url = 2;
}

// UpdateUserResponse carries the updated user record.
message UpdateUserResponse {
  User user = 1;
}

// UserService manages user account profiles.
//
// Account creation for end-users goes through AuthenticationService.Register,
// which also handles email verification. CreateUser here is not implemented.
service UserService {
  // CreateUser is not implemented and returns UNIMPLEMENTED.
  // Use AuthenticationService.Register instead.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // GetUser returns the profile and summary counts for the given username.
  // Readable anonymously.
  //
  // Returns NOT_FOUND if no account with that username exists, and also for
  // organization accounts: look those up with OrgService.GetOrg.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ListUsers returns up to 50 user accounts matching an optional username
  // query. Organization accounts are excluded.
  //
  // Returns UNAUTHENTICATED to anonymous callers: member discovery is expected
  // within a registry, but not open to unauthenticated scraping.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // UpdateUser updates the description and url for the authenticated caller's account.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
}
