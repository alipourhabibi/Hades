// Audit log API for the Hades schema registry.
//
// The audit log is an append-only record of security-relevant actions performed
// by or on behalf of a user account. Events are never updated or deleted.
// Callers can page through their own event history with ListAuditLog, whose
// page_token is an opaque offset into the caller's events ordered newest first.

syntax = "proto3";

package hades.api.auth.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/auth/v1";

// AuditEventType enumerates the security-relevant events the audit log can
// record. Not every value is emitted yet: MODULE_CREATED and MODULE_UPDATED
// are reserved for module writes, which do not currently write audit rows.
enum AuditEventType {
  AUDIT_EVENT_TYPE_UNSPECIFIED            = 0;
  AUDIT_EVENT_TYPE_LOGIN_SUCCESS          = 1;
  AUDIT_EVENT_TYPE_LOGIN_FAILED           = 2;
  AUDIT_EVENT_TYPE_ACCOUNT_LOCKED         = 3;
  AUDIT_EVENT_TYPE_EMAIL_VERIFIED         = 4;
  AUDIT_EVENT_TYPE_LOGOUT                 = 5;
  AUDIT_EVENT_TYPE_PASSWORD_RESET         = 6;
  AUDIT_EVENT_TYPE_PASSWORD_CHANGED       = 7;
  AUDIT_EVENT_TYPE_API_TOKEN_CREATED      = 8;
  AUDIT_EVENT_TYPE_API_TOKEN_REVOKED      = 9;
  AUDIT_EVENT_TYPE_MODULE_CREATED         = 10;
  AUDIT_EVENT_TYPE_MODULE_UPDATED         = 11;
  AUDIT_EVENT_TYPE_SESSION_REVOKED        = 12;
  AUDIT_EVENT_TYPE_TOTP_ENABLED           = 13;
  AUDIT_EVENT_TYPE_TOTP_DISABLED          = 14;
  AUDIT_EVENT_TYPE_OAUTH_LINKED           = 15;
  AUDIT_EVENT_TYPE_OAUTH_UNLINKED         = 16;
}

// AuditEvent records a single security-relevant action.
message AuditEvent {
  // Unique event identifier (UUID).
  string id = 1;
  // Machine-readable event type.
  AuditEventType event_type = 2;
  // IP address of the client that triggered the event. Empty for events not
  // raised on the authentication path, which is where the address is resolved.
  string ip_address = 3;
  // User-Agent of the client. Empty under the same conditions as ip_address.
  string user_agent = 4;
  // Arbitrary event-specific key-value data (e.g. token ID, module name).
  google.protobuf.Struct metadata = 5;
  // When the event was recorded.
  google.protobuf.Timestamp created_at = 6;
}

// ListAuditLogRequest pages through the caller's audit events.
message ListAuditLogRequest {
  // Maximum number of events to return. Must be between 0 and 100 inclusive.
  // 0 uses the server default (50).
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  // Opaque pagination cursor from the previous response's next_page_token.
  // Empty means start from the most recent event.
  string page_token = 2;
}

// ListAuditLogResponse carries a page of audit events.
message ListAuditLogResponse {
  // Audit events for this page, ordered newest first.
  repeated AuditEvent events = 1;
  // Cursor for the next page. Empty when this is the last page.
  string next_page_token = 2;
}

// AuditService exposes the audit log for the authenticated user.
//
// Only the events belonging to the caller are accessible. Administrators
// querying events on behalf of other users must use an out-of-band mechanism.
//
// Requires an interactive session token (hds_sess_); personal API tokens are
// rejected, so a leaked token cannot read the owner's security history.
service AuditService {
  // ListAuditLog returns a page of audit events for the authenticated user,
  // newest first, via page_size and page_token.
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse);
}
