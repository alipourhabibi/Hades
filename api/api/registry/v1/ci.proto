// CI (lint and breaking-change) run results for the Hades schema registry.
//
// When a commit is pushed, the upload handler runs buf lint, and buf breaking
// against the previous commit when the module has breaking checks enabled.
// Both run synchronously and a violation rejects the push, so a commit that
// exists in the registry has already passed the checks configured for its
// module at that time. The result is recorded as a CIRun keyed by
// (module, commit_hash), in the same transaction that creates the commit.
//
// It follows that every stored CIRun has passed. A rejected push produces no
// commit, and a record is keyed by the commit hash, so there is nothing to
// attach a failure to. The lint_errors and breaking_errors fields exist for a
// future non-blocking check mode and are empty today. No record is written at
// all when linting is disabled for the deployment: a row claiming "passed" for
// checks that never ran would be worse than no row.

syntax = "proto3";

package hades.api.registry.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/registry/v1";

// CIRun holds the result of a lint and breaking-change check executed
// when a module commit was pushed. Each (module, commit_hash) pair has at
// most one CIRun record.
message CIRun {
  // Unique run identifier (UUID).
  string id = 1;
  // ID of the module this run belongs to.
  string module_id = 2;
  // Git commit hash the run was executed against.
  string commit_hash = 3;
  // True when no lint violations were found.
  bool lint_passed = 4;
  // True when no breaking changes were detected relative to the previous
  // commit. Also true when the module has breaking checks disabled or the
  // commit has no predecessor, since nothing was found to break.
  bool breaking_passed = 5;
  // Lint error messages. Empty when lint_passed is true.
  repeated string lint_errors = 6;
  // Breaking-change error messages. Empty when breaking_passed is true.
  repeated string breaking_errors = 7;
  // When the CI run record was created.
  google.protobuf.Timestamp create_time = 8;
}

// GetCIRunRequest is the input for CIService.GetCIRun.
message GetCIRunRequest {
  // Username of the module owner.
  string owner = 1 [(buf.validate.field).required = true];
  // Short module name (without the owner prefix).
  string module_name = 2 [(buf.validate.field).required = true];
  // Git commit hash to look up.
  string commit_hash = 3 [(buf.validate.field).required = true];
}

// GetCIRunResponse is the output for CIService.GetCIRun.
message GetCIRunResponse {
  CIRun ci_run = 1;
}

// CIService exposes CI run results for schema module commits.
//
// Readable anonymously, subject to the same per-module read check as the rest
// of the registry: a private module the caller cannot read is reported as
// NOT_FOUND.
service CIService {
  // GetCIRun returns the CI run result for the given owner/module/commit triple.
  //
  // Returns NOT_FOUND if the module does not exist, the caller cannot read it,
  // or no run record exists for that commit. The last case covers commits
  // pushed while linting was disabled, and the initial commit that
  // CreateModuleByName seeds, which runs no checks.
  rpc GetCIRun(GetCIRunRequest) returns (GetCIRunResponse);
}
