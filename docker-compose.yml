services:
  postgres:
    image: postgres:15.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hades}
      POSTGRES_DB: ${POSTGRES_DB:-hades}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hades}"]
      interval: 5s
      timeout: 5s
      retries: 10

  gitaly:
    image: alpinelinux/gitaly:17.6.2
    # GITALY_TESTING_NO_GIT_HOOKS disables Gitaly's hook execution. It is named
    # "TESTING" because that is what it is for; it stays here because this
    # deployment has no GitLab internal API for the hooks to call. It is a
    # deliberate choice, not an oversight.
    environment:
      - GITALY_TESTING_NO_GIT_HOOKS=true
    volumes:
      - gitaly_data:/var/lib/gitlab
      - ./development/config.toml:/etc/gitlab-gitaly/config.toml:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /var/lib/gitlab/repositories && gitaly serve /etc/gitlab-gitaly/config.toml",
      ]
    restart: unless-stopped

  minio:
    # Pinned. A floating tag means two deployments of the same commit can run
    # different software.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrator:
    image: ghcr.io/alipourhabibi/hades-migrate:latest
    command:
      - "-path=/migration"
      - "-database=postgres://${POSTGRES_USER:-hades}:${POSTGRES_PASSWORD:-hades}@postgres:5432/${POSTGRES_DB:-hades}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  hades:
    image: ghcr.io/alipourhabibi/hades:latest
    environment:
      # config/prod.yaml expands these. Without them the TOTP key expanded to
      # empty, config.Validate skips the length check on an empty value, and
      # startup succeeded with TOTP enrolment silently unavailable; the S3
      # credentials were hardcoded to minioadmin/minioadmin in the file.
      HADES_TOTP_ENCRYPTION_KEY: ${HADES_TOTP_ENCRYPTION_KEY:?set a 64-character hex key, see config/prod.yaml}
      HADES_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      HADES_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set a MinIO password}
    volumes:
      - ./config/prod.yaml:/app/config/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      gitaly:
        condition: service_started
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: ghcr.io/alipourhabibi/hades-frontend:latest
    environment:
      BACKEND_URL: http://hades:50051
      # NEXT_PUBLIC_* is inlined by Next.js at BUILD time, so setting it here on
      # a prebuilt image does nothing: the client bundle falls back to
      # window.location.host. It is passed as a build arg in
      # .github/workflows/docker-publish.yml. Kept here for a local `docker
      # compose build`, where it does apply.
      NEXT_PUBLIC_DOMAIN: ${DOMAIN:-example.com}
    depends_on:
      - hades
    restart: unless-stopped
    ports:
      - 3000:3000

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - hades
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  gitaly_data:
  minio_data:
  caddy_data:
  caddy_config:
