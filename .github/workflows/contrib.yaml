---
name: Build and Test on PR
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      # internal/proto/breaking and internal/proto/lint shell out to the buf
      # CLI. Without it the tests still run, and they lie: the checker reports
      # "cannot run buf" the same way it reports "this change is breaking", so
      # the test that wants an error passes and the test that wants none fails.
      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test ./... -v

      - name: Build application
        run: go build -o hades ./cmd/hades
