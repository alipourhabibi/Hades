server:
  listenPort: 50051
  registryHost: "example.com" # CHANGE: set to your actual domain
  certKey: "config/example.com-key.pem"
  certFile: "config/example.com.pem"
  # Serves the unauthenticated gRPC reflection API. Development only.
  enableReflection: false
  # CIDR ranges (or bare IPs) whose X-Forwarded-For / X-Real-IP headers are
  # believed when determining the client IP. The client IP drives login,
  # registration and password-reset rate limiting and is written to the audit
  # log, and these headers are trivially forged, so leave this empty unless
  # Hades sits behind a reverse proxy you control.
  trustedProxies: []
  # Listener timeouts. Empty values use the built-in defaults
  # (15s / 5m / 120s / 30s). There is deliberately no write timeout: the Go
  # module proxy streams SDK zips of unknown size.
  readHeaderTimeout: 15s
  readTimeout: 5m
  idleTimeout: 120s
  shutdownTimeout: 30s

logger:
  engine: zap # slog, zap

  # General configs
  format: json # json, text
  level: debug # debug, info, warn, error
  addSource: true
  output: stdout # stdout, stderr, file path

  # Encoder settings. Both engines honour these except where noted: the slog
  # engine used to ignore this whole section, so the same file produced two
  # different log schemas depending on the engine above.
  timeFormat: ISO8601 # ISO8601, RFC3339, RFC3339Nano, epoch, epoch_millis, epoch_nanos
  levelFormat: lowercase # lowercase, capital, capitalColor, color. The two colour spellings are plain capitals under slog, which has no colour support.
  durationFormat: string # string, nanos, ms. ZAP ONLY: slog renders a duration by its String method.
  callerFormat: full # full, short

  # Custom key names.
  timeKey: time
  levelKey: level
  nameKey: name # ZAP ONLY: slog has no logger name.
  callerKey: caller
  messageKey: message
  stacktraceKey: stacktrace # ZAP ONLY: slog captures no stack traces.

  # Sampling configuration. ZAP ONLY: slog has no sampler, so under
  # engine: slog every entry is emitted whatever is set here.
  sampling:
    initial: 100 # Sample the first N entries
    thereafter: 10 # Sample every Nth entry after Initial

backends:
  database: sqlite       # sqlite | postgres
  cache: memory          # memory | redis
  git: gogit             # gogit | gitaly
  artifactStorage: disk  # disk | gitaly | s3

sqlite:
  path: ./hades.db

gitStorage:
  root: ./_data/repos

diskStorage:
  path: ./_data/artifacts

gitaly:
  port: 9999
  defaultStorageName: default
  # Transport security on the Gitaly connection.
  tls: false
  caCertFile: ""
  serverNameOverride: ""

db:
  connectionString: "postgres://hades:hades@0.0.0.0:5432/hades?sslmode=disable"

telemetry:
  enabled: false
  serviceName: hades
  otlpEndpoint: "localhost:4317"
  prometheusPort: 9090
  pprofPort: 6060
  # Interface the metrics and pprof listeners bind to. Empty means 127.0.0.1.
  # Both are unauthenticated and pprof dumps process memory, so exposing
  # them on a public interface has to be deliberate.
  bindAddr: "127.0.0.1"
  # Required before either listener will bind to a non-loopback address. A
  # pprof heap dump contains live session tokens and neither endpoint
  # authenticates, so publishing them is a separate, named decision.
  allowPublicDiagnostics: false
  # Fraction of traces sampled. 1.0 samples every request, which costs both the
  # server and whatever collects the spans: during the E2E run it took the
  # Jaeger all-in-one container to 11.4 GB. Raise it temporarily when chasing a
  # specific request, and put it back.
  samplingRatio: 0.05

auth:
  password:
    minLength: 12
    bcryptCost: 12
  session:
    idleTimeoutDays: 7
    absoluteTimeoutDays: 14
  lockout:
    maxAttempts: 5
    cooldownMinutes: 30
  emailVerification:
    tokenExpiryHours: 24
    # Development only, and off here on purpose. It marks a new address as
    # verified without the user proving they control it, which is what
    # verification exists to prevent. It is useful when email.stub is on,
    # because then nothing is delivered and Login refuses an unverified account.
    autoVerify: false
  passwordReset:
    tokenExpiryHours: 1

email:
  stub: true # set to false and configure SMTP for real email delivery
  from: "noreply@example.com"

oauth:
  # Off by default. With it on, a first-time OAuth login takes over any local
  # account whose email the provider reports as verified, with no confirmation
  # step: a compromised provider account is then a full takeover of this one.
  allowAccountLinkingByEmail: false
  github:
    clientId: ""
    clientSecret: ""
    redirectUrl: "http://localhost:50051/oauth/github/callback"
  google:
    clientId: ""
    clientSecret: ""
    redirectUrl: "http://localhost:50051/oauth/google/callback"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# IMPORTANT: generate a random 64-char hex key before deploying
# openssl rand -hex 32
totp:
  # 32-byte AES-256 key as 64 hex characters: openssl rand -hex 32
  # Supplied through the environment so the key is not written to disk.
  # Leaving it unset disables TOTP enrolment rather than failing startup.
  encryptionKey: "${HADES_TOTP_ENCRYPTION_KEY}"
  issuer: "Hades"

# OPA authorization engine tuning.
# bindingCacheTTL: how long per-subject role-binding results are cached.
#   0s (default): memory backend → 10s, redis backend → 60s.
#   Set explicitly (e.g. "30s") to override for both backends.
# WARNING: memory cache is per-process; see DEPLOYMENT.md for multi-pod notes.
opa:
  bindingCacheTTL: 0s # 0s = backend-specific default (memory=10s, redis=60s)
  # Subjects that bypass every policy check. Empty is the recommendation: the
  # bypass has no scoping and no distinct audit signal. It is read by the Rego
  # policy as data.superadmins.
  superAdmins: []

sdk:
  enabled: true
  bufBin: "buf"
  lintEnabled: false
  breakingEnabled: false
  generators:
    - language: go
      plugin: protoc-gen-go
      options: "paths=source_relative"
  storage:
    type: disk
    s3:
      endpoint: "localhost:9000"
      bucket: "hades-sdks"
      accessKeyId: ""
      secretAccessKey: ""
      useSSL: false
      region: "us-east-1"
