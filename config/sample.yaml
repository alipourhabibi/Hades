server:
  listenPort: 50051
  registryHost: "example.com" # CHANGE: set to your actual domain
  certKey: "config/example.com-key.pem"
  certFile: "config/example.com.pem"

logger:
  engine: zap # slog, zap

  # General configs
  format: json # json, text
  level: debug # debug, info, warn, error
  addSource: true
  output: stdout # stdout, stderr, file path

  # Encoder settings
  timeFormat: ISO8601 # ISO8601, RFC3339, RFC3339Nano, epoch, epoch_millis, epoch_nanos
  levelFormat: lowercase # lowercase, capital, capitalColor, color
  durationFormat: string # string, nanos, ms
  callerFormat: full # full, short

  # Custom key names
  timeKey: time
  levelKey: level
  nameKey: name
  callerKey: caller
  messageKey: message
  stacktraceKey: stacktrace

  # Sampling configuration
  sampling:
    initial: 100 # Sample the first N entries
    thereafter: 10 # Sample every Nth entry after Initial

backends:
  database: sqlite       # sqlite | postgres
  cache: memory          # memory | redis
  git: gogit             # gogit | gitaly
  artifactStorage: disk  # disk | gitaly | s3

sqlite:
  path: ./hades.db

gitStorage:
  root: ./data/repos

diskStorage:
  path: ./data/artifacts

gitaly:
  port: 9999
  defaultStorageName: default

db:
  connectionString: "postgres://hades:hades@0.0.0.0:5432/hades?sslmode=disable"

telemetry:
  enabled: false
  serviceName: hades
  otlpEndpoint: "localhost:4317"
  prometheusPort: 9090
  pprofPort: 6060
  samplingRatio: 1.0

auth:
  password:
    minLength: 12
    bcryptCost: 12
  session:
    idleTimeoutDays: 7
    absoluteTimeoutDays: 14
    rotationGraceSeconds: 30
  lockout:
    maxAttempts: 5
    cooldownMinutes: 30
  emailVerification:
    tokenExpiryHours: 24
  passwordReset:
    tokenExpiryHours: 1

email:
  stub: true # set to false and configure SMTP for real email delivery
  from: "noreply@example.com"

oauth:
  github:
    clientId: ""
    clientSecret: ""
    redirectUrl: "http://localhost:50051/oauth/github/callback"
  google:
    clientId: ""
    clientSecret: ""
    redirectUrl: "http://localhost:50051/oauth/google/callback"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

# IMPORTANT: generate a random 64-char hex key before deploying
# openssl rand -hex 32
totp:
  encryptionKey: "CHANGE_ME_generate_with_openssl_rand_hex_32_output_here_000000000"
  issuer: "Hades"

# OPA authorization engine tuning.
# bindingCacheTTL: how long per-subject role-binding results are cached.
#   0s (default): memory backend → 10s, redis backend → 60s.
#   Set explicitly (e.g. "30s") to override for both backends.
# WARNING: the memory cache is per process. See DEPLOYMENT.md for multi-pod notes.
opa:
  bindingCacheTTL: 0s # 0s = backend-specific default (memory=10s, redis=60s)

sdk:
  enabled: true
  bufBin: "buf"
  lintEnabled: false
  breakingEnabled: false
  generators:
    - language: go
      plugin: protoc-gen-go
      options: "paths=source_relative"
  storage:
    type: disk
    s3:
      endpoint: "localhost:9000"
      bucket: "hades-sdks"
      accessKeyId: ""
      secretAccessKey: ""
      useSSL: false
      region: "us-east-1"
